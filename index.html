<!-- ============================================================
     Firebase 初始化（跟 WordLens 同樣的三層備援模式）
     
     ★ 使用前需修改：把下面 cfg 換成你新 Firebase 專案的 config
     ============================================================ -->
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,doc,setDoc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Firebase config - kumolaw 專案
const cfg={
  apiKey:"AIzaSyCv-VJpAiKo8d7CMoyAybR0N5W4P4LTmSk",
  authDomain:"kumolaw-b67fa.firebaseapp.com",
  projectId:"kumolaw-b67fa",
  storageBucket:"kumolaw-b67fa.firebasestorage.app",
  messagingSenderId:"548690697067",
  appId:"1:548690697067:web:90f70b481fdf62aedb8a2e"
};

const app=initializeApp(cfg);
const db=getFirestore(app);
const REF=doc(db,"law_users","kumo");

// ── 第一層：localStorage 本機備份
function lsBackup(cards,prog,notes){
  try{
    if(cards&&cards.length>0){
      localStorage.setItem("law-cards-backup",JSON.stringify(cards));
      localStorage.setItem("law-cards-count",cards.length);
    }
    if(prog)localStorage.setItem("law-prog-backup",JSON.stringify(prog));
    if(notes)localStorage.setItem("law-notes-backup",JSON.stringify(notes));
  }catch(e){console.warn("lsBackup",e);}
}
function lsRestore(){
  try{
    const cards=JSON.parse(localStorage.getItem("law-cards-backup")||"[]");
    const prog=JSON.parse(localStorage.getItem("law-prog-backup")||"{}");
    const notes=JSON.parse(localStorage.getItem("law-notes-backup")||"{}");
    return{cards,prog,notes};
  }catch(e){return{cards:[],prog:{},notes:{}};}
}

async function fbLoad(){
  try{
    const snap=await getDoc(REF);
    if(snap.exists()){
      const d=snap.data();
      const fbCards=d.cards||[];
      const fbProg=d.progress||{};
      const fbNotes=d.notes||{};
      
      // ── 第二層：比對本機備份
      const local=lsRestore();
      const knownCount=parseInt(localStorage.getItem("law-cards-count")||"0");
      
      if(fbCards.length===0&&local.cards.length>0){
        console.warn("⚠️ Firebase 資料為空，使用本機備份（"+local.cards.length+" 筆）");
        window._cards=local.cards;
        window._prog=local.prog;
        window._notes=local.notes;
        window._dataWarning="Firebase 資料異常，已自動從本機備份還原 "+local.cards.length+" 條。請確認後手動同步。";
      }else if(knownCount>0&&fbCards.length<knownCount*0.5){
        console.warn("⚠️ Firebase 筆數異常（"+fbCards.length+" vs 已知"+knownCount+"），使用本機備份");
        window._cards=local.cards.length>fbCards.length?local.cards:fbCards;
        window._prog=fbProg;
        window._notes=fbNotes;
        window._dataWarning="偵測到雲端條文數量異常減少，已自動選用較多的版本（"+window._cards.length+" 條）。";
      }else{
        window._cards=fbCards;
        window._prog=fbProg;
        window._notes=fbNotes;
        lsBackup(fbCards,fbProg,fbNotes);
      }
    }else{
      const local=lsRestore();
      if(local.cards.length>0){
        window._cards=local.cards;
        window._prog=local.prog;
        window._notes=local.notes;
        window._dataWarning="雲端無資料，已從本機備份還原 "+local.cards.length+" 條。";
      }else{
        window._cards=[];window._prog={};window._notes={};
      }
    }
  }catch(e){
    console.warn("fbLoad",e);
    const local=lsRestore();
    window._cards=local.cards;
    window._prog=local.prog;
    window._notes=local.notes;
    if(local.cards.length>0)window._dataWarning="離線模式：顯示本機備份的 "+local.cards.length+" 條。";
  }
}

async function fbSave(){
  try{
    const cards=window._cards||[];
    const prog=window._prog||{};
    const notes=window._notes||{};
    
    // ── 第三層：防止空資料覆蓋
    const knownCount=parseInt(localStorage.getItem("law-cards-count")||"0");
    if(knownCount>0&&cards.length===0){
      console.warn("🛑 阻止危險存檔：cards 為空但已知有 "+knownCount+" 筆");
      return;
    }
    if(knownCount>4&&cards.length<knownCount*0.5){
      console.warn("🛑 阻止危險存檔：條文數量從 "+knownCount+" 驟降至 "+cards.length);
      return;
    }
    await setDoc(REF,{cards,progress:prog,notes},{merge:true});
    lsBackup(cards,prog,notes);
    window._syncStatus="synced";
    if(window._onSync)window._onSync();
  }catch(e){
    console.warn("fbSave",e);
    window._syncStatus="error";
    if(window._onSync)window._onSync();
  }
}
window.fbSave=fbSave;

fbLoad().then(()=>{
  window._fbReady=true;
  window._syncStatus="synced";
  if(window._onFbReady)window._onFbReady();
});
</script>

</style>

    <div class="afield">

<section class="view" id="v-sets">
  <div class="stwrap">
    <div class="stgroup">

      <button class="stitem" id="btn-import">
        <div class="stitem-ic">⬆</div>
        <div class="stitem-main"><div class="stitem-t">匯入 JSON</div><div class="stitem-s">批次載入條文（與現有合併）</div></div>
      </button>
      <button class="stitem" id="btn-sync">
        <div class="stitem-ic">↻</div>
        <div class="stitem-main"><div class="stitem-t">強制同步到雲端</div><div class="stitem-s">把本機資料推上 Firebase</div></div>
      </button>
      <input type="file" id="fileimp" accept="application/json" style="display:none">
    </div>
    
    <div class="stgroup">
      <div class="stgroup-t">Danger Zone</div>
      <button class="stitem danger" id="btn-clear">
        <div class="stitem-ic" style="color:var(--rd)">✕</div>
        <div class="stitem-main"><div class="stitem-t" style="color:var(--rd)">清空所有資料</div><div class="stitem-s" style="color:rgba(239,68,68,.7)">無法復原</div></div>
      </button>

    <div class="stgroup">
      <div class="stgroup-t">About</div>
      <div class="stabout">
        勞動法複習 v0.1<br><br>
        採用 SM-2 間隔重複演算法，資料同步於 Firestore 並有 localStorage 本機備援。<br><br>
        用戶：kumo<br>
        建議定期使用「匯出備份」。
      </div>
    </div>
  </div>

<nav>
  <button data-v="home" class="on"><span class="ni">◉</span><span>總覽</span></button>
  <button data-v="card"><span class="ni">⬚</span><span>閃卡</span></button>
  <button data-v="add"><span class="ni">+</span><span>新增</span></button>
  <button data-v="search"><span class="ni">⚲</span><span>檢索</span></button>
  <button data-v="notes"><span class="ni">✎</span><span>筆記</span></button>
  <button data-v="sets"><span class="ni">⚙</span><span>設定</span></button>
</nav>

</div>

<script>
// ==========================================
// State
// ==========================================
let cards=[],prog={},notes={};
let currentCard=null,cardQueue=[],cardIdx=0,cardFlipped=false;
let searchFilter="全部",searchQuery="",expandedCard=null,editingCard=null;
let noteFilter="all",editingNote=null;

// ==========================================
// SM-2 演算法
// ==========================================
function sm2(existing,quality){
  let{reps=0,interval=0,ease=2.5}=existing||{};
  if(quality<3){reps=0;interval=1;}
  else{
    ease=Math.max(1.3,ease+0.1-(5-quality)*(0.08+(5-quality)*0.02));
    reps+=1;
    if(reps===1)interval=1;
    else if(reps===2)interval=3;
    else interval=Math.round(interval*ease);
  }
  return{reps,interval,ease,next:Date.now()+interval*86400000,last:Date.now()};
}

function nextReviewLabel(interval){
  if(interval<=1)return"明天";
  if(interval<30)return interval+" 天後";
  if(interval<365)return Math.round(interval/30)+" 個月後";
  return Math.round(interval/365)+" 年後";
}

// ==========================================
// Utility
// ==========================================
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function toast(msg){
  const el=document.createElement("div");
  el.className="toast";el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1800);
}
function save(){
  window._cards=cards;window._prog=prog;window._notes=notes;
  window._syncStatus="syncing";updateSyncBadge();
  if(window.fbSave)window.fbSave();
}
function updateSyncBadge(){
  const dot=document.getElementById("sdot"),txt=document.getElementById("stxt");
  if(!dot)return;
  const s=window._syncStatus;
  dot.className="sdot"+(s==="error"?" err":s==="syncing"?" sync":"");
  txt.textContent=s==="error"?"同步失敗":s==="syncing"?"同步中…":"已同步 · kumo";
}
window._onSync=updateSyncBadge;

// ==========================================
// 導覽
// ==========================================
function showView(v){
  document.querySelectorAll(".view").forEach(el=>el.classList.remove("show"));
  document.getElementById("v-"+v).classList.add("show");
  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("on",b.dataset.v===v);
  });
  if(v==="home")renderHome();
  else if(v==="card")startReview();
  else if(v==="add")renderAdd();
  else if(v==="search")renderSearch();
  else if(v==="notes")renderNotes();
}
document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click",()=>showView(b.dataset.v));
});

// ==========================================
// 總覽
// ==========================================
function renderHome(){
  const total=cards.length;
  let learned=0,master=0,due=0;
  const now=Date.now();
  const byLaw={};
  
  cards.forEach(c=>{
    byLaw[c.law]=(byLaw[c.law]||0)+1;
    const p=prog[c.id];
    if(p){
      learned++;
      if(p.reps>=3)master++;
      if(p.next<=now)due++;
    }else due++;
  });
  
  document.getElementById("st-total").textContent=total;
  document.getElementById("st-learned").textContent=learned;
  document.getElementById("st-master").textContent=master;
  document.getElementById("today-n").textContent=due;
  
  const btn=document.getElementById("btn-start");
  if(total===0){
    document.getElementById("today-desc").textContent="還沒有任何條文";
    btn.textContent="先去新增條文 →";
    btn.onclick=()=>showView("add");
    btn.disabled=false;
  }else if(due===0){
    document.getElementById("today-desc").textContent="今日已完成";
    btn.textContent="今日已完成";
    btn.disabled=true;
    btn.onclick=null;
  }else{
    document.getElementById("today-desc").textContent="張卡片等待複習";
    btn.textContent="開始複習 →";
    btn.disabled=false;
    btn.onclick=()=>showView("card");
  }
  
  // 法規分布
  const catsH=document.getElementById("cats-h"),catsL=document.getElementById("cats-list");
  const keys=Object.keys(byLaw);
  if(keys.length===0){
    catsH.style.display="none";catsL.innerHTML="";
  }else{
    catsH.style.display="block";
    catsL.innerHTML=keys.sort().map(k=>
      `<div class="catrow"><div class="catname">${k}</div><div class="catnum">${byLaw[k]}</div></div>`
    ).join("");
  }
  
  // 警告訊息
  const wb=document.getElementById("warnbox");
  if(window._dataWarning){
    wb.innerHTML=`<div class="warn">${window._dataWarning}</div>`;
  }else wb.innerHTML="";
}

// ==========================================
// 閃卡
// ==========================================
function startReview(){
  const now=Date.now();
  cardQueue=cards.filter(c=>{
    const p=prog[c.id];
    return!p||p.next<=now;
  }).sort(()=>Math.random()-0.5);
  cardIdx=0;
  cardFlipped=false;
  renderCard();
}

function renderCard(){
  const wrap=document.getElementById("card-content");
  
  if(cardQueue.length===0){
    wrap.innerHTML=`
      <div class="done">
        <div class="done-ico">📚</div>
        <div class="done-ttl">沒有條文可以複習</div>
        <div class="done-msg">先到「新增」頁建立一些條文吧</div>
        <button class="bp" onclick="showView('home')" style="max-width:200px">返回總覽</button>
      </div>`;
    return;
  }
  
  if(cardIdx>=cardQueue.length){
    wrap.innerHTML=`
      <div class="done">
        <div class="done-ico">🎌</div>
        <div class="done-ttl">本輪複習完成</div>
        <div class="done-msg">下次複習時間已根據你的熟練度自動安排</div>
        <button class="bp" onclick="showView('home')" style="max-width:200px">返回總覽</button>
      </div>`;
    return;
  }
  
  const c=cardQueue[cardIdx];
  const pgPct=((cardIdx+1)/cardQueue.length)*100;
  const note=notes[c.id];
  
  let cardHtml;
  if(!cardFlipped){
    cardHtml=`
      <div class="qcard qcard-front" onclick="flipCard()">
        <div class="qlaw">${c.law}</div>
        <div class="qnum">${c.num}</div>
        ${c.title?`<div class="qttl">${c.title}</div>`:""}
        <div class="qhint">點擊翻面</div>
      </div>`;
  }else{
    cardHtml=`
      <div class="qcard qcard-back" onclick="flipCard()">
        <div class="qback-head">
          <div class="qback-law">${c.law}</div>
          <div class="qback-num">${c.num}</div>
        </div>
        ${c.title?`<div class="qback-ttl">${c.title}</div>`:""}
        <div class="qcontent">${escapeHtml(c.content)}</div>
        ${note?`<div class="qnote"><div class="qnote-lbl">My Note</div><div class="qnote-txt">${escapeHtml(note)}</div></div>`:""}
      </div>`;
  }
  
  const existing=prog[c.id];
  const predA=sm2(existing,1),predB=sm2(existing,3),predC=sm2(existing,5);
  
  wrap.innerHTML=`
    <div class="qtop">
      <button class="qback" onclick="showView('home')">‹</button>
      <div class="qcnt">${cardIdx+1} / ${cardQueue.length}</div>
      <button class="qflip" onclick="flipCard()">↻</button>
    </div>
    <div class="qprog"><div class="qfill" style="width:${pgPct}%"></div></div>
    ${cardHtml}
    ${cardFlipped?`
      <div class="rate-lbl">評估熟練度</div>
      <div class="rates">
        <button class="rate rd" onclick="rateCard(1)">
          <div class="rate-ico">✕</div>
          <div class="rate-tx">忘記</div>
          <div class="rate-sub">${nextReviewLabel(predA.interval)}</div>
        </button>
        <button class="rate gy" onclick="rateCard(3)">
          <div class="rate-ico">◐</div>
          <div class="rate-tx">模糊</div>
          <div class="rate-sub">${nextReviewLabel(predB.interval)}</div>
        </button>
        <button class="rate gr" onclick="rateCard(5)">
          <div class="rate-ico">✓</div>
          <div class="rate-tx">熟練</div>
          <div class="rate-sub">${nextReviewLabel(predC.interval)}</div>
        </button>
      </div>`:""}
  `;
}

window.flipCard=()=>{cardFlipped=!cardFlipped;renderCard();};
window.rateCard=(q)=>{
  const c=cardQueue[cardIdx];
  prog[c.id]=sm2(prog[c.id],q);
  save();
  cardFlipped=false;
  cardIdx++;
  renderCard();
};
window.showView=showView;

// ==========================================
// 新增
// ==========================================
function renderAdd(){
  document.getElementById("saved-msg").innerHTML="";
  const laws=[...new Set(cards.map(c=>c.law))];
  const chipsEl=document.getElementById("law-chips");
  chipsEl.innerHTML=laws.map(l=>`<button class="chip" data-law="${escapeHtml(l)}">${escapeHtml(l)}</button>`).join("");
  chipsEl.querySelectorAll(".chip").forEach(b=>{
    b.addEventListener("click",()=>{document.getElementById("f-law").value=b.dataset.law;});
  });
}

function doAdd(andContinue){
  const law=document.getElementById("f-law").value.trim();
  const num=document.getElementById("f-num").value.trim();
  const ttl=document.getElementById("f-ttl").value.trim();
  const ctt=document.getElementById("f-ctt").value.trim();
  
  if(!law||!num||!ctt){
    alert("請至少填寫「法律名稱」、「條號」、「內容」");
    return;
  }
  
  cards.push({id:uid(),law,num,title:ttl||"",content:ctt,createdAt:Date.now()});
  save();
  
  if(andContinue){
    document.getElementById("f-num").value="";
    document.getElementById("f-ttl").value="";
    document.getElementById("f-ctt").value="";
    document.getElementById("saved-msg").innerHTML=`<div class="saved-msg">✓ 已儲存 "${escapeHtml(law)} ${escapeHtml(num)}"</div>`;
    setTimeout(()=>{document.getElementById("saved-msg").innerHTML="";},2000);
    document.getElementById("f-num").focus();
  }else{
    showView("home");
  }
}
document.getElementById("btn-saveadd").addEventListener("click",()=>doAdd(true));
document.getElementById("btn-savedone").addEventListener("click",()=>doAdd(false));
document.getElementById("btn-start").addEventListener("click",()=>showView("card"));

// ==========================================
// 檢索
// ==========================================
function renderSearch(){
  const laws=["全部",...new Set(cards.map(c=>c.law))];
  const fxEl=document.getElementById("slfx");
  fxEl.innerHTML=laws.map(l=>`<button class="scat${l===searchFilter?" on":""}" data-law="${escapeHtml(l)}">${escapeHtml(l)}</button>`).join("");
  fxEl.querySelectorAll(".scat").forEach(b=>{
    b.addEventListener("click",()=>{searchFilter=b.dataset.law;renderSearch();});
  });
  
  let filtered=cards;
  if(searchFilter!=="全部")filtered=filtered.filter(c=>c.law===searchFilter);
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    filtered=filtered.filter(c=>
      c.num.toLowerCase().includes(q)||
      c.title.toLowerCase().includes(q)||
      c.content.toLowerCase().includes(q)||
      c.law.toLowerCase().includes(q)
    );
  }
  
  document.getElementById("scnt").textContent=filtered.length+" 筆結果";
  
  const list=document.getElementById("slist");
  if(filtered.length===0){
    list.innerHTML=`<div class="empty" style="padding:40px 0"><div class="empty-msg">${cards.length===0?"還沒有條文":"沒有符合的條文"}</div></div>`;
    return;
  }
  
  list.innerHTML=filtered.map(c=>{
    const isOpen=expandedCard===c.id;
    const isEdit=editingCard===c.id;
    const note=notes[c.id];
    if(isEdit){
      return `<div class="sitem"><div class="edit-form">
        <input class="inp" id="ed-law-${c.id}" value="${escapeHtml(c.law)}" placeholder="法律">
        <input class="inp" id="ed-num-${c.id}" value="${escapeHtml(c.num)}" placeholder="條號">
        <input class="inp" id="ed-ttl-${c.id}" value="${escapeHtml(c.title)}" placeholder="標題">
        <textarea class="inp txt" id="ed-ctt-${c.id}">${escapeHtml(c.content)}</textarea>
        <div class="arow">
          <button class="bs" onclick="cancelEdit()">取消</button>
          <button class="bp" onclick="saveEdit('${c.id}')">儲存修改</button>
        </div>
      </div></div>`;
    }
    return `<div class="sitem">
      <div class="sitem-h" onclick="toggleExpand('${c.id}')">
        <div class="sitem-top">
          <span class="sitem-law">${escapeHtml(c.law)}</span>
          <span class="sitem-num">${escapeHtml(c.num)}</span>
        </div>
        ${c.title?`<div class="sitem-ttl">${escapeHtml(c.title)}</div>`:""}
        ${note?`<div class="sitem-tag">• 已筆記</div>`:""}
      </div>
      <div class="sitem-b ${isOpen?"open":""}">
        <div class="sitem-txt">${escapeHtml(c.content)}</div>
        ${note?`<div class="qnote"><div class="qnote-lbl">My Note</div><div class="qnote-txt">${escapeHtml(note)}</div></div>`:""}
        <div class="sitem-acts">
          <button class="actbtn" onclick="startEdit('${c.id}')">✎ 編輯</button>
          <button class="actbtn del" onclick="delCard('${c.id}')">✕ 刪除</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

document.getElementById("srch").addEventListener("input",e=>{
  searchQuery=e.target.value;
  renderSearch();
});

window.toggleExpand=(id)=>{
  expandedCard=(expandedCard===id?null:id);
  renderSearch();
};
window.startEdit=(id)=>{editingCard=id;renderSearch();};
window.cancelEdit=()=>{editingCard=null;renderSearch();};
window.saveEdit=(id)=>{
  const c=cards.find(x=>x.id===id);
  if(!c)return;
  c.law=document.getElementById("ed-law-"+id).value.trim();
  c.num=document.getElementById("ed-num-"+id).value.trim();
  c.title=document.getElementById("ed-ttl-"+id).value.trim();
  c.content=document.getElementById("ed-ctt-"+id).value.trim();
  editingCard=null;
  save();
  renderSearch();
  toast("已儲存");
};
window.delCard=(id)=>{
  if(!confirm("確定刪除這條？複習進度與筆記也會一併刪除。"))return;
  cards=cards.filter(c=>c.id!==id);
  delete prog[id];
  delete notes[id];
  save();
  renderSearch();
  toast("已刪除");
};

// ==========================================
// 筆記
// ==========================================
document.querySelectorAll(".nfilter").forEach(b=>{
  b.addEventListener("click",()=>{noteFilter=b.dataset.nf;renderNotes();});
});

function renderNotes(){
  document.querySelectorAll(".nfilter").forEach(b=>b.classList.toggle("on",b.dataset.nf===noteFilter));
  document.getElementById("note-cnt").textContent=Object.keys(notes).length;
  
  let list=cards;
  if(noteFilter==="has")list=list.filter(c=>notes[c.id]);
  
  const el=document.getElementById("nlist");
  if(list.length===0){
    el.innerHTML=`<div class="empty" style="padding:40px 0"><div class="empty-msg">${cards.length===0?"還沒有條文":"沒有筆記"}</div></div>`;
    return;
  }
  
  el.innerHTML=list.map(c=>{
    const n=notes[c.id]||"";
    const isEdit=editingNote===c.id;
    let body;
    if(isEdit){
      body=`<div class="nedit">
        <textarea class="inp" id="nt-${c.id}" placeholder="寫下你對這條的理解、案例、關鍵字、易混淆點…">${escapeHtml(n)}</textarea>
        <div class="arow">
          <button class="bs" onclick="cancelNote()">取消</button>
          <button class="bp" onclick="saveNote('${c.id}')">儲存</button>
        </div>
      </div>`;
    }else if(n){
      body=`<div class="nitem-body" onclick="editNote('${c.id}')">${escapeHtml(n)}</div>`;
    }else{
      body=`<div class="nitem-empty" onclick="editNote('${c.id}')">+ 新增筆記</div>`;
    }
    return `<div class="nitem">
      <div class="nitem-h">
        <span class="sitem-law">${escapeHtml(c.law)}</span>
        <span class="sitem-num">${escapeHtml(c.num)}</span>
        ${c.title?`<span class="sitem-ttl">${escapeHtml(c.title)}</span>`:""}
      </div>
      ${body}
    </div>`;
  }).join("");
}

window.editNote=(id)=>{editingNote=id;renderNotes();};
window.cancelNote=()=>{editingNote=null;renderNotes();};
window.saveNote=(id)=>{
  const txt=document.getElementById("nt-"+id).value.trim();
  if(txt)notes[id]=txt;
  else delete notes[id];
  editingNote=null;
  save();
  renderNotes();
  toast("已儲存筆記");
};

// ==========================================
// 設定：匯出 / 匯入 / 同步 / 清空
// ==========================================
document.getElementById("btn-export").addEventListener("click",()=>{
  const data={
    version:1,
    exportedAt:new Date().toISOString(),
    cards,progress:prog,notes,
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="勞動法複習_備份_"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  URL.revokeObjectURL(url);
  toast("已匯出備份");
});

document.getElementById("btn-import").addEventListener("click",()=>{
  document.getElementById("fileimp").click();
});
document.getElementById("fileimp").addEventListener("change",async e=>{
  const f=e.target.files[0];
  if(!f)return;
  try{
    const txt=await f.text();
    const data=JSON.parse(txt);
    if(!Array.isArray(data.cards))throw new Error("JSON 格式不正確");
    // 匯入卡片（避免 id 衝突）
    const existingIds=new Set(cards.map(c=>c.id));
    let added=0;
    data.cards.forEach(c=>{
      const newCard={
        id:existingIds.has(c.id)?uid():(c.id||uid()),
        law:c.law||"未分類",
        num:c.num||"",
        title:c.title||"",
        content:c.content||"",
        createdAt:c.createdAt||Date.now(),
      };
      cards.push(newCard);
      added++;
    });
    save();
    toast("成功匯入 "+added+" 條");
    showView("home");
  }catch(err){
    alert("匯入失敗："+err.message);
  }
  e.target.value="";
});

document.getElementById("btn-sync").addEventListener("click",()=>{
  save();
  toast("同步中…");
});

document.getElementById("btn-clear").addEventListener("click",()=>{
  if(!confirm("確定清空所有資料？這個動作無法復原！"))return;
  if(!confirm("再確認一次：所有條文、進度、筆記都會刪除。"))return;
  // 繞過第三層防護：直接清空本機計數
  localStorage.removeItem("law-cards-count");
  localStorage.removeItem("law-cards-backup");
  localStorage.removeItem("law-prog-backup");
  localStorage.removeItem("law-notes-backup");
  cards=[];prog={};notes={};
  save();
  renderHome();
  toast("已清空");
});

// ==========================================
// 工具
// ==========================================
function escapeHtml(s){
  if(s==null)return"";
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

// ==========================================
// 啟動
// ==========================================
function boot(){
  cards=window._cards||[];
  prog=window._prog||{};
  notes=window._notes||{};
  updateSyncBadge();
  renderHome();
}
if(window._fbReady)boot();
else window._onFbReady=boot;
</script>
